name: Release

# Tagging is the whole trigger: `git tag v1.2.3 && git push --tags` checks the
# changelog has a section for it, then publishes a GitHub Release whose body is
# that section.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 1.2.3)"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Work out which version this is
        id: pick
        # Values reach the script through the environment, never pasted into
        # it, so a version or tag name cannot become shell.
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          # A release with no notes is one nobody can read, so this stops here
          # rather than publishing an empty body.
          packaging/release-notes.sh "$version" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the linter
        run: pipx install ruff

      - name: Prove this version works
        run: make check

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          version="$VERSION"
          packaging/release-notes.sh "$version" > notes.md
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "v${version} exists: updating its notes"
            gh release edit "v${version}" --title "feature-map ${version}" --notes-file notes.md
          else
            gh release create "v${version}" --target "$GITHUB_SHA" \
              --title "feature-map ${version}" --notes-file notes.md
          fi
